# TillTally sync Worker configuration.
#
# Deployed live on 2026-11-12 (Cloudflare free tier, $0). The D1 database
# `tilltally` below already exists and has schema.sql applied.
# Redeploy after changing worker.js:  npx wrangler deploy   (from this folder)
# Full walkthrough in ../README.md.

name = "tilltally-api"
main = "worker.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "tilltally"
database_id = "d15794fa-c82e-4e11-86ee-2c8dca8a6730"
