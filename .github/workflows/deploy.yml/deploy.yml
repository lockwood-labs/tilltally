# Deploy TillTally on every push to main:
#   1. the sync Worker (worker/) to Cloudflare Workers
#   2. the PWA frontend to Cloudflare Pages — via scripts/deploy-pages.sh,
#      which stamps a unique version into sw.js/config.js, so installed
#      apps update themselves on next open (no reinstall).
#
# ONE-TIME SETUP (repo owner): add two secrets in
#   GitHub repo → Settings → Secrets and variables → Actions → New secret
#     CLOUDFLARE_API_TOKEN    a Cloudflare API token with Workers + Pages
#                             + D1 edit permissions for the account
#     CLOUDFLARE_ACCOUNT_ID   the Cloudflare account id
# No tokens live in this repo; the workflow only reads those secrets.
name: Deploy TillTally

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler@3

      - name: Test the money math
        run: npm test

      - name: Deploy sync Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Deploy frontend to Pages (auto-stamped shell version)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CMD: wrangler
        run: scripts/deploy-pages.sh --branch main
